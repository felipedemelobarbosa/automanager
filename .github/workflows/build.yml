# Gera os instaladores do AutoManager: .exe (Windows), .dmg (macOS) e .deb (Linux).
# - Manualmente: aba Actions > "Build" > "Run workflow" (os arquivos ficam em Artifacts, na página da execução).
# - Ao criar uma tag v* (ex.: v0.1): também publica uma Release com os três arquivos.
name: Build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  testes:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python -m unittest discover -s tests

  build:
    needs: testes
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            alvo: exe
          - os: macos-latest
            alvo: dmg
          - os: ubuntu-22.04
            alvo: deb
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependências
        run: pip install pyinstaller pillow
      - name: Versão
        run: echo "VERSAO=$(python -c 'import automanager; print(automanager.VERSAO)')" >> "$GITHUB_ENV"

      - name: Windows (.exe)
        if: matrix.alvo == 'exe'
        run: |
          pyinstaller --noconfirm --onefile --windowed --name AutoManager \
            --add-data "database:database" --add-data "lang:lang" main.py
          mv dist/AutoManager.exe "AutoManager-${VERSAO}-windows.exe"

      - name: macOS (.dmg)
        if: matrix.alvo == 'dmg'
        run: |
          pyinstaller --noconfirm --windowed --name AutoManager \
            --add-data "database:database" --add-data "lang:lang" main.py
          hdiutil create -volname AutoManager -srcfolder dist/AutoManager.app -ov -format UDZO \
            "AutoManager-${VERSAO}-macos.dmg"

      - name: Linux (.deb)
        if: matrix.alvo == 'deb'
        run: |
          sudo apt-get update && sudo apt-get install -y libtk8.6
          pyinstaller --noconfirm --windowed --name AutoManager \
            --add-data "database:database" --add-data "lang:lang" main.py
          packaging/build_deb.sh "${VERSAO}" dist/AutoManager "AutoManager-${VERSAO}-linux-amd64.deb"

      - uses: actions/upload-artifact@v4
        with:
          name: AutoManager-${{ matrix.alvo }}
          path: AutoManager-*.${{ matrix.alvo }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: pacotes
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: pacotes/*
